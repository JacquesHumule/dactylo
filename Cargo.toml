[package]
name = "dactylo"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.43"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.65"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
itertools = "0.14.0"
rand = "0.10.0-rc.7"
ratatui = { version = "0.30.0", features = ["macros", "unstable-widget-ref"] }
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.18"

[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
